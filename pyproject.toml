[project]
name = "vimax-rh"
version = "0.1.0"
description = "ViMax-RH: Idea-to-Video pipeline powered by RunningHub ComfyUI workflow APIs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.0",
    "chardet>=5.2.0",
    "faiss-cpu>=1.12.0",
    "langchain>=0.3.26",
    "langchain-community>=0.3.27",
    "langchain-openai>=0.3.27",
    "moviepy>=2.2.1",
    "openai>=1.95.0",
    "opencv-python",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "scenedetect[opencv]>=0.6.7.1",
    "tenacity>=8.2.0",
    "Pillow>=10.0.0",
]

[[index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
